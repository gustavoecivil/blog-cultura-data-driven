name: World Cup 2022 FIFA PDF Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe-fifa-squad-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download official FIFA squad list
        run: |
          mkdir -p /tmp/fifa
          curl -L --fail --retry 3 https://fdp.fifa.org/assetspublic/ce44/pdf/SquadLists-English.pdf -o /tmp/fifa/SquadLists-English.pdf
          pdftotext -layout /tmp/fifa/SquadLists-English.pdf /tmp/fifa/SquadLists-English.txt
          sed -n '1,120p' /tmp/fifa/SquadLists-English.txt
      - name: Upload extracted text probe
        uses: actions/upload-artifact@v4
        with:
          name: fifa-squad-pdf-text-probe
          path: |
            /tmp/fifa/SquadLists-English.txt
            /tmp/fifa/SquadLists-English.pdf
          retention-days: 2
